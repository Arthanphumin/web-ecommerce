<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุทธิภูมินท์ อาจหาร - ลงทะเบียนธีมสีรุ้ง</title>
    <!-- นำเข้า Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- นำเข้า Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            /* พื้นหลังไล่เฉดสีรุ้งแบบพาสเทลอ่อน ๆ นุ่มตา */
            background: linear-gradient(45deg, #ffdee9 0%, #b5fffc 100%);
            min-height: 100vh;
        }
        .form-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        /* หัวข้อไล่เฉดสีรุ้งสดใส */
        .card-header-rainbow {
            background: linear-gradient(45deg, #ff3366, #ff9933, #ffff33, #33cc66, #3399ff, #9933ff);
            background-size: 200% auto;
            color: white;
            padding: 24px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
            animation: rainbowShift 5s linear infinite;
        }
        /* ปุ่มลงทะเบียนสีรุ้งสดใส */
        .btn-rainbow {
            background: linear-gradient(45deg, #ff416c, #ff4b2b, #ff9933, #33cc66, #3399ff);
            background-size: 200% auto;
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-rainbow:hover {
            background-position: right center;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        /* เอฟเฟกต์สีรุ้งขยับได้บาง ๆ */
        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* เปลี่ยนสีโฟกัสกล่องข้อความให้เป็นสีรุ้งอมชมพู-ฟ้า */
        .form-control:focus, .form-select:focus {
            border-color: #ff99bb;
            box-shadow: 0 0 0 0.25rem rgba(255, 153, 203, 0.25);
        }
        /* ตกแต่ง Checkbox สีม่วงรุ้ง */
        .form-check-input:checked {
            background-color: #9933ff;
            border-color: #9933ff;
        }
        /* ปุ่ม Lazada สีส้มแบบสว่างขึ้น */
        .btn-lazada {
            background-color: #ff5722;
            color: white;
            transition: all 0.2s;
        }
        .btn-lazada:hover {
            background-color: #f4511e;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card form-card">
                <!-- หัวการ์ดเฉดสีรุ้ง -->
                <div class="card-header-rainbow text-center">
                    <h3 class="mb-0 fw-bold">🌈 สุทธิภูมินท์ อาจหาร(บิ๊กบอส) 🌈</h3>
                </div>
                
                <div class="card-body p-4 bg-white">
                    <form method="post" action="z.php" enctype="multipart/form-data">
                        
                        <!-- ชื่อ-สกุล -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">ชื่อ-สกุล</label>
                            <input type="text" class="form-control rounded-3" name="fullname" required placeholder="กรอกชื่อ-นามสกุลของคุณ">
                        </div>

                        <!-- อีเมล -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">อีเมล</label>
                            <input type="email" class="form-control rounded-3" name="email" placeholder="example@email.com">
                        </div>

                        <!-- อายุ -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">อายุ (ปี)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" name="age" min="18" max="60" required placeholder="18-60">
                                <span class="input-group-text bg-light text-secondary">ปี</span>
                            </div>
                        </div>

                        <!-- วันที่ -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">วันที่</label>
                            <input type="date" class="form-control rounded-3" name="date">
                        </div>

                        <!-- สี -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">สีที่ชอบ</label>
                            <input type="color" class="form-control form-control-color w-100 rounded-3" name="color" value="#ff3366">
                        </div>

                        <!-- ที่อยู่ -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">ที่อยู่</label>
                            <textarea class="form-control rounded-3" name="address" rows="3" placeholder="กรอกที่อยู่ปัจจุบันของคุณ"></textarea>
                        </div>

                        <!-- อาหารที่ชอบ -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary d-block">อาหารที่ชอบ</label>
                            <div class="p-3 rounded-3 border" style="background-color: #fff9fb;">
                                <div class="row g-2">
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ข้าวมันไก่" id="f1"><label class="form-check-label text-dark" for="f1">ข้าวมันไก่</label></div></div>
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ข้าวขาหมู" id="f2" checked><label class="form-check-label text-dark" for="f2">ข้าวขาหมู</label></div></div>
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ก๋วยเตี๋ยว" id="f3"><label class="form-check-label text-dark" for="f3">ก๋วยเตี๋ยว</label></div></div>
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ส้มตำ" id="f4"><label class="form-check-label text-dark" for="f4">ส้มตำ</label></div></div>
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ไก่ย่าง" id="f5"><label class="form-check-label text-dark" for="f5">ไก่ย่าง</label></div></div>
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ลาบหมู" id="f6" checked><label class="form-check-label text-dark" for="f6">ลาบหมู</label></div></div>
                                    <div class="col-6 col-sm-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="food[]" value="ลาบไก่" id="f7"><label class="form-check-label text-dark" for="f7">ลาบไก่</label></div></div>
                                </div>
                            </div>
                        </div>

                        <!-- สาขาวิชา -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">สาขาวิชา</label>
                            <select class="form-select rounded-3" name="major">
                                <option value="การบัญชี">การบัญชี</option>
                                <option value="การตลาด">การตลาด</option>
                                <option value="การจัดการ">การจัดการ</option>
                                <option value="บริหารการเงิน">บริหารการเงิน</option>
                                <option value="DBIS">DBIS</option>
                                <option value="BC">BC</option>
                            </select>
                        </div>

                        <!-- รูปภาพ -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary">รูปภาพ</label>
                            <input class="form-control rounded-3" type="file" name="picture">
                        </div>

                        <!-- กลุ่มปุ่มกดสไตล์สีรุ้งและพาสเทล -->
                        <div class="row g-2">
                            <div class="col-12">
                                <button type="submit" name="Submit" class="btn btn-rainbow w-100 py-2.5 fw-bold shadow-sm rounded-3">✨ ลงทะเบียนสำเร็จรูป ✨</button>
                            </div>
                            <div class="col-6">
                                <button type="reset" class="btn btn-light w-100 py-2 border rounded-3 text-secondary">Reset</button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-info w-100 py-2 rounded-3 fw-semibold" onclick="window.print();">🖨️ พิมพ์หน้านี้</button>
                            </div>
                            <div class="col-12">
                                <button type="button" class="btn btn-link text-decoration-none w-100 py-2 text-muted fs-7" onmouseover="alert('สวัสดี');">✨ เลื่อนมาทักทายตรงนี้ (Alert) ✨</button>
                            </div>
                            <div class="col-12 mt-2">
                                <button type="button" class="btn btn-lazada w-100 py-2.5 fw-bold shadow-sm rounded-3" onclick="window.location='https://www.lazada.co.th/';">🛍️ ช้อปเลยที่ Lazada</button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- นำเข้า Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
