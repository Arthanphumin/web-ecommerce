<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครงาน - บริษัท จิ๊บ จิ๊บ จำกัด</title>
    <!-- Bootstrap v5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            /* พื้นหลังสีรุ้งพาสเทลแบบมินิมอล จาง ๆ สบายตา */
            background: linear-gradient(135deg, #ffeef2 0%, #fff6e6 25%, #ffffcc 50%, #e6f9ff 75%, #f2e6ff 100%);
            min-height: 100vh;
            color: #495057;
        }
        
        .main-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.05);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* หัวการ์ดไล่เฉดสีรุ้งแบบมินิมอลพาสเทล */
        .rainbow-header {
            background: linear-gradient(45deg, #ff7675, #fab1a0, #ffeaa7, #55efc4, #74b9ff, #a29bfe);
            padding: 40px 20px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #2d3436;
            /* เส้นใต้แบ่งหัวข้อไล่สีรุ้ง */
            border-bottom: 3px solid;
            border-image: linear-gradient(to right, #ff7675, #fab1a0, #ffeaa7, #55efc4, #74b9ff, #a29bfe) 1;
        }

        /* ตกแต่ง Input ให้มินิมอลเมื่อโฟกัส */
        .form-control:focus, .form-select:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 0.25rem rgba(162, 155, 254, 0.25);
            background-color: #fff;
        }

        /* สี Checkbox และ Radio เปลี่ยนตามธีมพาสเทล */
        .form-check-input:checked {
            background-color: #74b9ff;
            border-color: #74b9ff;
        }

        /* ปุ่มส่งข้อมูลไล่เฉดสีรุ้ง */
        .btn-rainbow {
            background: linear-gradient(45deg, #ff7675, #fab1a0, #74b9ff, #a29bfe);
            background-size: 200% auto;
            color: white;
            border: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-rainbow:hover {
            background-position: right center;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(116, 185, 255, 0.4);
        }

        .company-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-xl-9 col-lg-10">
            
            <div class="card main-card">
                <!-- ส่วนหัวบริษัทและรูปภาพประกอบ -->
                <div class="rainbow-header text-center position-relative">
                    <!-- รูปภาพโลโก้/ไก่ประกอบฟอร์ม (มินิมอล) -->
                    <img src="https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=400&auto=format&fit=crop&q=80" alt="Gai Logo" class="company-logo mb-3">
                    <h2 class="fw-bold mb-1">บริษัท ก๊าบ ก๊าบ จำกัด 🐔</h2>
                    <p class="mb-0 opacity-90 fw-light">ระบบรับสมัครพนักงานออนไลน์ - ร่วมเติบโตไปกับธุรกิจค้าไก่อันดับหนึ่ง</p>
                </div>
                
                <div class="card-body p-4 p-sm-5">
                    <form action="save_job.php" method="POST" enctype="multipart/form-data">
                        
                        <!-- SECTION 1: ตำแหน่งที่ต้องการสมัคร -->
                        <div class="section-title">1. ข้อมูลการสมัครงาน</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">ตำแหน่งที่ต้องการสมัคร (อันดับ 1) [1]</label>
                                <select class="form-select" name="job_position_1" required>
                                    <option value="" selected disabled>เลือกตำแหน่ง...</option>
                                    <option value="ฝ่ายผลิตและชำแหละ">ฝ่ายผลิตและแปรรูปเนื้อไก่</option>
                                    <option value="ควบคุมคุณภาพ QA/QC">ฝ่ายควบคุมคุณภาพ (QA/QC)</option>
                                    <option value="พนักงานขับรถส่งของ">พนักงานขับรถส่งสินค้า (ห้องเย็น)</option>
                                    <option value="ฝ่ายขายและการตลาด">เจ้าหน้าที่ฝ่ายขาย/การตลาด</option>
                                    <option value="บัญชีและการเงิน">เจ้าหน้าที่บัญชี</option>
                                    <option value="สัตวบาลประจำฟาร์ม">สัตวบาลประจำฟาร์มไก่</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">ตำแหน่งสำรอง (อันดับ 2) [2]</label>
                                <select class="form-select" name="job_position_2">
                                    <option value="" selected disabled>เลือกตำแหน่ง...</option>
                                    <option value="ฝ่ายผลิตและชำแหละ">ฝ่ายผลิตและแปรรูปเนื้อไก่</option>
                                    <option value="ควบคุมคุณภาพ QA/QC">ฝ่ายควบคุมคุณภาพ (QA/QC)</option>
                                    <option value="พนักงานขับรถส่งของ">พนักงานขับรถส่งสินค้า (ห้องเย็น)</option>
                                    <option value="ฝ่ายขายและการตลาด">เจ้าหน้าที่ฝ่ายขาย/การตลาด</option>
                                    <option value="บัญชีและการเงิน">เจ้าหน้าที่บัญชี</option>
                                    <option value="สัตวบาลประจำฟาร์ม">สัตวบาลประจำฟาร์มไก่</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">เงินเดือนที่คาดหวัง (บาท) [3]</label>
                                <input type="number" class="form-control" name="expected_salary" min="15000" max="100000" placeholder="เช่น 18000" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">วันที่พร้อมเริ่มงาน [4]</label>
                                <input type="date" class="form-control" name="start_date" required>
                            </div>
                        </div>

                        <!-- SECTION 2: ประวัติส่วนตัว -->
                        <div class="section-title">2. ประวัติส่วนตัว</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-2">
                                <label class="form-label fw-semibold">คำนำหน้า [5]</label>
                                <select class="form-select" name="title_name" required>
                                    <option>นาย</option>
                                    <option>นาง</option>
                                    <option>นางสาว</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-semibold">ชื่อจริง [6]</label>
                                <input type="text" class="form-control" name="firstname" placeholder="ภาษาไทย" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-semibold">นามสกุล [7]</label>
                                <input type="text" class="form-control" name="lastname" placeholder="ภาษาไทย" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">ชื่อเล่น [8]</label>
                                <input type="text" class="form-control" name="nickname" placeholder="เช่น ก๊าบ">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">เลขบัตรประชาชน [9]</label>
                                <input type="text" class="form-control" name="id_card" maxlength="13" placeholder="เลข 13 หลัก" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">วัน/เดือน/ปีเกิด [10]</label>
                                <input type="date" class="form-control" name="birthdate" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">อายุ (ปี) [11]</label>
                                <input type="number" class="form-control" name="age" min="18" max="60" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">ส่วนสูง (ซม.) [12]</label>
                                <input type="number" class="form-control" name="height" placeholder="ซม.">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">น้ำหนัก (กก.) [13]</label>
                                <input type="number" class="form-control" name="weight" placeholder="กก.">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">กรุ๊ปเลือด [14]</label>
                                <select class="form-select" name="blood_type">
                                    <option>A</option>
                                    <option>B</option>
                                    <option>O</option>
                                    <option>AB</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">สัญชาติ [15]</label>
                                <input type="text" class="form-control" name="nationality" value="ไทย">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">ศาสนา [16]</label>
                                <input type="text" class="form-control" name="religion" placeholder="เช่น พุทธ / คริสต์ / อิสลาม">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">สถานภาพการสมรส [17]</label>
                                <div class="d-flex gap-4 p-2 bg-light rounded-3 border">
                                    <div class="form-check"><input class="form-check-input" type="radio" name="marital_status" value="โสด" id="m1" checked><label class="form-check-label" for="m1">โสด</label></div>
                                    <div class="form-check"><input class="form-check-input" type="radio" name="marital_status" value="สมรส" id="m2"><label class="form-check-label" for="m2">สมรส</label></div>
                                    <div class="form-check"><input class="form-check-input" type="radio" name="marital_status" value="หย่าร้าง" id="m3"><label class="form-check-label" for="m3">หย่าร้าง</label></div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 3: ข้อมูลการติดต่อ -->
                        <div class="section-title">3. ข้อมูลการติดต่อและที่อยู่</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">เบอร์โทรศัพท์ [18]</label>
                                <input type="tel" class="form-control" name="phone" placeholder="เช่น 0891234567" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">โทนสีเสื้อผ้าประจำตัวที่ชอบ (ใส่มาสัมภาษณ์) [19]</label>
                                <input type="color" class="form-control form-control-color w-100" name="interview_color" value="#74b9ff">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">ที่อยู่ปัจจุบันตามทะเบียนบ้าน [20]</label>
                                <textarea class="form-control" name="address" rows="3" placeholder="บ้านเลขที่ หมู่ ซอย ถนน ตำบล อำเภอ จังหวัด..." required></textarea>
                            </div>
                        </div>

                        <!-- SECTION 4: ประวัติการศึกษาและความสามารถ -->
                        <div class="section-title">4. วุฒิการศึกษาและความสามารถพิเศษ</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">ระดับการศึกษาสูงสุด [21]</label>
                                <select class="form-select" name="education_level" required>
                                    <option>มัธยมศึกษาตอนปลาย / ปวช.</option>
                                    <option>อนุปริญญา / ปวส.</option>
                                    <option>ปริญญาตรี</option>
                                    <option>ปริญญาโท หรือสูงกว่า</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">เกรดเฉลี่ยสะสม (GPAX) [22]</label>
                                <input type="number" class="form-control" name="gpax" step="0.01" min="0.00" max="4.00" placeholder="0.00 - 4.00">
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-semibold">ทักษะความสามารถพิเศษ (เลือกได้หลายข้อ) [23]</label>
                                <div class="bg-light p-3 rounded-3 border">
                                    <div class="row g-2">
                                        <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="skills[]" value="ขับรถยนต์ได้มีใบขับขี่" id="s1"><label class="form-check-label" for="s1">ขับรถยนต์/มีใบขับขี่</label></div></div>
                                        <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="skills[]" value="ใช้คอมพิวเตอร์สำนักงาน" id="s2"><label class="form-check-label" for="s2">Microsoft Office/คอมพิวเตอร์</label></div></div>
                                        <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="skills[]" value="ภาษาอังกฤษสื่อสารได้" id="s3"><label class="form-check-label" for="s3">สื่อสารภาษาอังกฤษ</label></div></div>
                                        <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="skills[]" value="ทักษะเจรจาต่อรองการค้า" id="s4"><label class="form-check-label" for="s4">เจรจาต่อรองการค้า</label></div></div>
                                        <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="skills[]" value="ผ่านการอบรมอาหารปลอดภัย" id="s5"><label class="form-check-label" for="s5">ผ่านอบรมสุขาภิบาลอาหาร</label></div></div>
                                        <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="skills[]" value="ขับรถโฟล์คลิฟต์ได้" id="s6"><label class="form-check-label" for="s6">ขับรถโฟล์คลิฟต์ (คลังสินค้า)</label></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 5: เอกสารแนบ -->
                        <div class="section-title">5. เอกสารสมัครงานหลักฐานหลัก</div>
                        <div class="row g-3 mb-5">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">อัปโหลดรูปถ่ายหน้าตรงปัจจุบัน [24]</label>
                                <input class="form-control" type="file" name="profile_img" accept="image/*" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">อัปโหลดประวัติย่อ (Resume / CV) [25]</label>
                                <input class="form-control" type="file" name="resume_file" accept=".pdf,.doc,.docx" required>
                            </div>
                        </div>

                        <!-- ปุ่มควบคุมท้ายฟอร์ม -->
                        <div class="row g-3">
                            <div class="col-md-8">
                                <button type="submit" class="btn btn-rainbow w-100 py-3 rounded-3 shadow">ส่งใบสมัครงานออนไลน์ ✨</button>
                            </div>
                            <div class="col-md-4">
                                <button type="reset" class="btn btn-outline-secondary w-100 py-3 rounded-3">เคลียร์ข้อมูล (Reset)</button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap v5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
